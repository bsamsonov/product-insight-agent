[project]
name = "poc-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "poc-core",
  "poc-llm",
  "poc-agent",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.29",
  "poc-retrieval",
  "poc-ingestion",
  "poc-guardrails",
  "poc-audit",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]

[tool.uv.sources]
poc-core = { workspace = true }
poc-llm = { workspace = true }
poc-agent = { workspace = true }
poc-retrieval = { workspace = true }
poc-ingestion = { workspace = true }
poc-guardrails = { workspace = true }
poc-audit = { workspace = true }
