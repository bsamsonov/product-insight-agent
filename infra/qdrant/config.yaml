# Qdrant configuration for Product Insight Agent POC
# Reference: https://qdrant.tech/documentation/guides/configuration/

service:
  host: 0.0.0.0
  http_port: 6333
  grpc_port: 6334
  # Max request body size in MB
  max_request_size_mb: 32

storage:
  # Threshold for switching from in-memory to on-disk index (vectors count)
  optimizers_config:
    default_segment_number: 2

log_level: INFO
