[project]
name = "poc-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "langchain-core>=0.3",
    "langgraph>=0.2",
    "poc-core",
    "poc-guardrails",
    "poc-llm",
    "poc-observability",
    "poc-prompts",
    "poc-retrieval",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/poc"]

[tool.uv.sources]
poc-core = { workspace = true }
poc-guardrails = { workspace = true }
poc-llm = { workspace = true }
poc-observability = { workspace = true }
poc-prompts = { workspace = true }
poc-retrieval = { workspace = true }
