[project]
name = "poc-audit"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=23.0",
    "asyncpg>=0.29",
    "pydantic-settings>=2.0",
    "poc-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/poc"]

[tool.uv.sources]
poc-core = { workspace = true }
