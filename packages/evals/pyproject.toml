[project]
name = "poc-evals"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "poc-core",
    "poc-llm",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/poc"]

[tool.uv.sources]
poc-core = { workspace = true }
poc-llm = { workspace = true }
