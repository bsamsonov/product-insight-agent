[project]
name = "poc-ingestion"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "poc-core",
  "fast-langdetect>=0.2.0",
  "datasets>=2.0",
  "tiktoken>=0.13.0",
]

[tool.uv.sources]
poc-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/poc"]
