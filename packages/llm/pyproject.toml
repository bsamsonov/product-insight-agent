[project]
name = "poc-llm"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "tenacity>=8.2",
    "PyYAML>=6.0",
    "redis>=5.0",
    "poc-core",
    "poc-observability",
]

[tool.uv.sources]
poc-core = { workspace = true }
poc-observability = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/poc"]
