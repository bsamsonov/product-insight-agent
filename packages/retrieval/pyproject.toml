[project]
name = "poc-retrieval"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "poc-core",
    "poc-ingestion",
    "qdrant-client>=1.9",
    "rank-bm25>=0.2",
    "sentence-transformers>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/poc"]

[tool.uv.sources]
poc-core = { workspace = true }
poc-ingestion = { workspace = true }
