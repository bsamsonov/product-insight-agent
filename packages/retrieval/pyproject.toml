[project]
name = "poc-retrieval"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "poc-core",
    "poc-ingestion",
    "qdrant-client>=1.9",
    "rank-bm25>=0.2",
    "sentence-transformers>=3.0",
    # Declare torch directly so the workspace-root CPU index override binds
    # (uv sources apply to direct deps). Capped to what the CPU index carries
    # for cp312 (latest there is 2.9.x); avoids the CUDA build from PyPI.
    "torch<2.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/poc"]

[tool.uv.sources]
poc-core = { workspace = true }
poc-ingestion = { workspace = true }
